name = "x-rss-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"

# أرشفة خلفية: كل 5 دقائق يسحب الخادم حساباً واحداً (بالدور) ويخزّن نتيجته في KV.
# خلاصات /user و/feed تُقرأ من هذا المخزون مباشرة، فلا تصطدم بحد الـ5 ثوانٍ عند
# استيراد عدة خلاصات دفعة واحدة في قارئ RSS. مناسب للأرشفة وليس للمتابعة اللحظية.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "TWEETS_KV"
id = "865d876f108d42e79553d7e54579b81f"

[vars]
# مدة التخزين المؤقت بالثواني لخلاصات البحث الحيّة (/search) فقط
CACHE_TTL = "900"

# المتغيّرات السرية (لا تضعها هنا):
#   npx wrangler secret put TWITTERAPI_KEY   ← مفتاح twitterapi.io (إلزامي)
#   npx wrangler secret put ACCESS_KEY       ← اختياري: يمنع الغرباء من استهلاك رصيدك
